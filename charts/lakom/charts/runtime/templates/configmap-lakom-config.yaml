---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.global.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
  {{ toYaml .Values.cosign | nindent 4 }}
