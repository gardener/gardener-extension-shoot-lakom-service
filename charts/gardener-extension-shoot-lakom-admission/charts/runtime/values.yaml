image:
  repository: europe-docker.pkg.dev/gardener-project/public/gardener/extensions/shoot-lakom-admission
  tag: latest
  pullPolicy: IfNotPresent
replicaCount: 1
resources: {}
metricsPort: 8080
healthPort: 8081
vpa:
  enabled: true
  resourcePolicy:
    minAllowed:
      memory: 64Mi
    maxAllowed:
      cpu: 2
      memory: 2Gi
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
webhookConfig:
  serverPort: 10250
# Kubeconfig to the target cluster. In-cluster configuration will be used if not specified.
kubeconfig:
# projectedKubeconfig:
#   baseMountPath: /var/run/secrets/gardener.cloud
#   genericKubeconfigSecretName: generic-token-kubeconfig
#   tokenSecretName: access-shoot-lakom-admission
service:
  topologyAwareRouting:
    enabled: false

gardener:
  virtualCluster: {}
  # runtimeCluster: {} # Presence of the 'runtimeCluster' object is used to identify if the extension controller is being deployed for the the Garden or Shoot extension, do not set it in default values, let gardener manage this object.
  #   priorityClassName: gardener-garden-system-400