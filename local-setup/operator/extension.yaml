apiVersion: operator.gardener.cloud/v1alpha1
kind: Extension
metadata:
  annotations:
    security.gardener.cloud/pod-security-enforce: baseline
  name: extension-shoot-lakom-service
spec:
  deployment:
    admission:
      runtimeCluster:
        helm:
          ociRepository:
            ref: local-skaffold/gardener-extension-shoot-lakom-admission/charts/runtime
            caBundleSecretRef:
              name: gardener-local-registry-ca
      virtualCluster:
        helm:
          ociRepository:
            ref: local-skaffold/gardener-extension-shoot-lakom-admission/charts/application
            caBundleSecretRef:
              name: gardener-local-registry-ca
    extension:
      helm:
        ociRepository:
          ref: local-skaffold/gardener-extension-shoot-lakom-service/charts/extension
          caBundleSecretRef:
            name: gardener-local-registry-ca
      policy: Always
      values: {}
      runtimeClusterValues: {}
  resources:
  - kind: Extension
    type: shoot-lakom-service
    clusterCompatibility:
      - garden
      - shoot
