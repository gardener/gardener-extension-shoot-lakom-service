apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reuse the default operator overlay as base so the skaffold-generated image patches
# (patch-extension-image.yaml, patch-admission-image.yaml, patch-imagevector-overwrite.yaml)
# are inherited. This overlay flips allowUntrustedImages to false so the lakom webhook actually
# rejects unsigned images (required by the signature-verification e2e spec), and disables the
# seed-bootstrap controller so the seed-wide lakom webhook is not installed so lakom extension's
# unsigned control-plane resources are not blocked.
resources:
- ../operator
# Allow the garden-virtual lakom pods to reach the local kind registry (deny-all + operator egress
# policies in ns `garden` otherwise block the 172.18.0.0/24 node CIDR where the registry runs), so the
# garden-signature-verification e2e spec can exercise the live virtual webhook.
- allow-lakom-registry-egress.yaml

patches:
- patch: |
    - op: replace
      path: /spec/deployment/extension/values/controllers/allowUntrustedImages
      value: false
    - op: add
      path: /spec/deployment/extension/values/controllers/seedBootstrap
      value:
        disabled: true
    - op: replace
      path: /spec/deployment/extension/runtimeClusterValues/controllers/allowUntrustedImages
      value: false
  target:
    group: operator.gardener.cloud
    kind: Extension
    name: extension-shoot-lakom-service
